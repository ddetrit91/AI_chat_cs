<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Открыть чат">
  <defs>
    <linearGradient id="g-bg" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#52E07A" />
      <stop offset="0.5" stop-color="#2DB742" />
      <stop offset="1" stop-color="#168A34" />
    </linearGradient>
    <linearGradient id="g-shine" x1="20" y1="8" x2="44" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="g-skin" x1="32" y1="22" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF5EB" />
      <stop offset="1" stop-color="#E8C9A8" />
    </linearGradient>
    <clipPath id="clip">
      <circle cx="32" cy="32" r="32" />
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="64" height="64" fill="url(#g-bg)" />
    <ellipse cx="24" cy="18" rx="18" ry="14" fill="url(#g-shine)" />

    <!-- shoulders -->
    <path
      fill="#fff"
      fill-opacity="0.22"
      d="M0 64h64V48c-6-4-14-6-22-6h-4c-8 0-16 2-22 6v16z"
    />

    <!-- head -->
    <circle cx="32" cy="30" r="14" fill="url(#g-skin)" />
    <path
      fill="#2A1F1A"
      fill-opacity="0.55"
      d="M19 29.5c0-8.5 5-13.5 13-13.5s13 5 13 13.5c-2.2-.9-5.2-1.3-13-1.3s-10.8 0.4-13 1.3z"
    />

    <!-- headset band -->
    <path
      stroke="#fff"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
      d="M14 33.5c0-12 7.5-19 18-19s18 7 18 19"
    />
    <!-- ear cups -->
    <rect x="10" y="29" width="9" height="14" rx="4.5" fill="#fff" />
    <rect x="45" y="29" width="9" height="14" rx="4.5" fill="#fff" />
    <rect x="12.5" y="31.5" width="4.5" height="9" rx="2.25" fill="#2DB742" fill-opacity="0.35" />
    <rect x="47" y="31.5" width="4.5" height="9" rx="2.25" fill="#2DB742" fill-opacity="0.35" />
    <!-- mic -->
    <path
      stroke="#fff"
      stroke-width="2.25"
      stroke-linecap="round"
      fill="none"
      d="M45 40c-2.5 3.5-5.5 4.5-9.5 3.5"
    />
    <circle cx="36" cy="43.5" r="2.25" fill="#fff" />

    <!-- minimal face -->
    <circle cx="27" cy="31" r="1.5" fill="#3D3028" fill-opacity="0.65" />
    <circle cx="37" cy="31" r="1.5" fill="#3D3028" fill-opacity="0.65" />
    <path
      d="M28 36.5c2.5 1.5 7 1.5 9.5 0"
      stroke="#C48868"
      stroke-width="1.75"
      stroke-linecap="round"
      fill="none"
      opacity="0.85"
    />

    <!-- chat hint -->
    <g transform="translate(42 14)">
      <rect x="0" y="0" width="14" height="11" rx="3" fill="#fff" fill-opacity="0.95" />
      <path d="M3 11 L7 14 L7 11 Z" fill="#fff" fill-opacity="0.95" />
      <circle cx="4.5" cy="5.5" r="1.1" fill="#2DB742" />
      <circle cx="7" cy="5.5" r="1.1" fill="#2DB742" />
      <circle cx="9.5" cy="5.5" r="1.1" fill="#2DB742" />
    </g>
  </g>
</svg>
